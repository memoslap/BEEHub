name: BEHub
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.8

  # Data manipulation
  - pandas>=1.3.0
  - numpy>=1.21.0

  # Statistical analysis
  - scipy>=1.7.0

  # File handling
  - pip

  - pip:
    - pathlib2>=2.3.6
    # ── Required for the reliability pipeline ──
    # pingouin provides the canonical ICC / Cronbach α / Hedges' g
    # implementations with analytical & bootstrap confidence intervals.
    # The pipeline falls back to a home-grown ANOVA point-estimate-only
    # path when pingouin is unavailable, but you lose CIs and the F-test
    # — strongly recommended to keep this installed.
    - pingouin>=0.5.0

# Optional dependencies for extended functionality
# Uncomment if you need additional statistical tests beyond pingouin:
#  - pip:
#    - statsmodels>=0.13.0
