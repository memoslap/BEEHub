  # instr_21.jpg (02_Instr_2.sce), instr_31.jpg through instr_34.jpg (04_Instr_3.sce).
  # These map to Folie1.JPG..Folie12.JPG in the local Instr/instr/ directory.
  # For the PsychoPy conversion we use Folie*.JPG and map the instruction text
  # from the PCL comments or the Instructions.pptx slides.

open_questions:
  - id: instr_mapping
    status: open
    question: |
      The sce files reference instr_*.jpg files (instr_11..17, instr_21, instr_31..34)
      that do NOT exist in the Stimuli tree. Instead, Folie*.JPG exports from
      Instructions.pptx exist in the Instr/instr/ directory. What is the mapping
      between the instr_NN.jpg references and the Folie*.JPG files?
      The sce files use the instr_NN filenames in bitmap declarations — the generated
      PsychoPy needs the Folie*.JPG equivalents.
    answer: |
      Assumption: instr_11..17 → Folie1..7 (instruction part 1), instr_21 → Folie8
      (instruction part 2), instr_31..34 → Folie9..12 (instruction part 3).
      The Folie numbering matches the slide order in the PowerPoint. This mapping
      should be confirmed with the study author or by inspecting the slide content.
    applies_to: instruction screens

  - id: practice_phase
    status: open
    question: |
      The .exp file references 01_Prac.sce, but the probe report says it is not actually
      invoked in the scenario chain (not listed in the sce section of the exp).
      Does the short paradigm include a practice phase, or only the instruction phases
      (00_Instr_1 -> 02_Instr_2 -> 03_learning -> 04/05_AFC -> 04_Instr_3)?
    answer: |
      Likely: the practice phase was removed for the short version. The sce files
      01_Prac.sce and 01_Prac_old.sce still exist but are NOT referenced.
      The scenario chain for the short version is:
        00_Instr_1 → 02_Instr_2 → 03_learning → 04/05_AFC → 04_Instr_3
    manifest_action: skip practice phase; include only the referenced scenarios.

  - id: block_order_randomization
    status: open
    question: |
      The PCL shuffles order[] = {"learning-1","learning-2","control-1"} at runtime
      with constraints. For the generated experiment, should we also randomize at
      runtime with the same constraints, or use a fixed order?
    answer: |
      Preserve runtime randomisation with the same two constraints:
        (1) first block NOT control
        (2) no two adjacent blocks same type
      Seed from participant ID for reproducibility.
    manifest_action: |
      blocks: {randomize: true, seed_from: participant_id,
               constraints: [first_block_not_control, no_adjacent_same_type]}

  - id: AFC_scenario
    status: open
    question: |
      Which AFC scenario is used? 04_AFC (shuffle=0, jpg_filter=0, size 1224×987)
      or 05_AFC (shuffle=1, jpg_filter=1, size 1324×1087)?
    answer: |
      Recommend 05_AFC (shuffled, .jpg filter bug fix). This is the more robust variant
      and the .jpg filter prevents non-image files from being loaded as stimuli.
      The image size difference (1224×987 vs 1324×1087) should be confirmed.
    manifest_action: Use 05_AFC.sce with image size 1324×1087.

