# BEEHub Conversion Manifest — OLM SET_short
# Pass 1 — Inventory (NO code)
# generated: 2026-07-21T14:40:00Z

paradigm: OLM_SET_short
source:
  exp: Projects/OLM/paradigm/presentation/OLM_paradigm_short/SET_short/Locato10_fMRT.exp
  scenarios:
    - sce/00_Instr_1.sce          # 7 white-bg instruction pages, button 1=continue, button 2=final
    - sce/01_Prac.sce             # (obsolete — not referenced; 01_Prac_old.sce also exists)
    - sce/02_Instr_2.sce          # 1 white-bg instruction page, button 2=continue
    - sce/03_learning.sce         # main experiment: interleaved learning + control blocks, feedback
    - sce/04_AFC.sce              # forced-choice test, no shuffle, 2-button (1/2)
    - sce/04_Instr_3.sce          # 4 white-bg instruction pages
    - sce/05_AFC.sce              # forced-choice test, shuffled, 2-button (1/2), .jpg filter
  stimuli_root: Projects/OLM/paradigm/presentation/OLM_paradigm_short/SET_short/Stimuli
  generated: 2026-07-21T14:40:00Z

display:
  background_rgb: [255, 255, 255]   # instruction screens (00_Instr_1, 02_Instr_2, 04_Instr_3)
  background_rgb_dark: [0, 0, 0]    # experiment screens (01_Prac, 03_learning, 04/05_AFC)
  units: pix
  instr_img_size: [1280, 720]       # full-screen instruction images

response:
  keys: ['left', 'right']           # Keyboard in PsychoPy: left=correct/yes (code 1), right=wrong/no (code 2)
  quit_key: escape
  timeout_ms: null                  # trials use trial_duration=forever; waits for response
  # Original hardware: Presentation ResponseGrips (port codes 'a'=97, 'b'=98) in scanner;
  # mapped to codes 1,2 in the paradigm. PsychoPy uses keyboard instead.
  # Accuracy: code 1 on "_k_" file = correct; code 2 on "_i_" file = correct.

# ────────────────────────────────────────────────────────────────────────────────────────
# BLOCK STRUCTURE — derived from 03_learning.sce begin_pcl
#
# The PCL builds 5 pairs of up/down houses from the allPicsA10_short directory:
#   10 _k_ files (correct-position images) + 20 _i_ files (wrong-position foils)
#   => 10 house-image pairs.
#
# Then it interleaves up/down: ups[5] + downs[5] => 10 items in picPairs.
#
# Items are split into:
#   blk1: picPairs[1..5]  (first 5 houses: h16, h17, h103, h104, h105)
#   blk2: picPairs[6..10] (last 5 houses: h1, h4, h8, h113, h115)
#   ctrl1: random selection from picPairs — 5 houses × 4 reps = 20 trials per rep
#
# Each block has 4 repetitions (LS1..LS4), with a per-repetition shuffle via shuffleItems()
# that prevents consecutive same-house presentations.
#
# Block order array: {"learning-1", "learning-2", "control-1"}
# Shuffled with constraints: first block NOT control, no two adjacent blocks same type.
# Only 3 block types in short version (vs 6 in full SET_A).
#
# Per-block trial count:
#   blk1: 5 pairs => each pair produces correct+foils => 10 trials × 4 reps = 40 trials
#   blk2: same => 40 trials
#   ctrl1: 5 houses × 4 reps = 20 trials
#
# Total learning phase: 3 blocks × interleaved = 40 + 40 + 20 = 100 trials
# ────────────────────────────────────────────────────────────────────────────────────────

blocks:
  - name: instruction_part1
    type: instruction
    n_trials: 7                         # 7 pages (Anw1..Anw7), button-terminated
    randomize: false

  - name: instruction_part2
    type: instruction
    n_trials: 1                         # 1 page (Anw1), button-terminated
    randomize: false

  - name: learning-1
    type: learning
    n_trials: 40                        # 5 house pairs × 2 (correct+foils) × 4 reps
    unique_stimuli: 10                  # 5 correct (_k_) + 5 foils (_i_) shown per rep
    randomize: true                     # items shuffled per rep, no consecutive same house
    stages: 4                           # LS1..LS4
    has_feedback: true

  - name: learning-2
    type: learning
    n_trials: 40                        # 5 house pairs × 2 × 4 reps
    unique_stimuli: 10
    randomize: true
    stages: 4
    has_feedback: true

  - name: control-1
    type: control
    n_trials: 20                        # 5 houses × 4 reps
    unique_stimuli: 5
    randomize: true                     # ctrl1.shuffle() each rep
    stages: 4
    has_feedback: true
    question: "Is the house on the right side?"
    # Single screen: image + question, 2500 ms.
    # mainTrial presentation is commented out in PCL — deliberate; only FeedTrial runs.

  - name: intro_hello
    type: instruction
    n_trials: 1                         # brief "Das Experiment beginnt gleich..." flash
    duration_ms: 100
    randomize: false

  - name: bye_screen
    type: instruction
    n_trials: 1                         # bubbles/bye.png, shown after last block
    duration_ms: null                   # button-terminated
    randomize: false

  - name: learning_test (AFC)
    type: AFC
    n_trials: 10                        # 10 AFC images (3-position test)
    unique_stimuli: 10
    randomize: false                    # 04_AFC: shuffle=0; 05_AFC: shuffle=1
    stages: 1
    has_feedback: false
    keys: ['1', '2', '3']
    note: "Use 05_AFC.sce (shuffled, .jpg filter). Image size 1324×1087."

events:
  - id: fixation
    kind: text
    text: "+"
    color: white
    duration_ms: 4500                   # inter-block fixation
    size_px: 100
    pos: [0, 0]

  - id: stimulus
    kind: bitmap
    duration_ms: 2500
    pos: [0, -70]
    size_px: [1024, 787]

  - id: response_learning
    kind: response
    duration_ms: 2500                   # response window within stimulus duration
    collect: true
    note: trial runs to end even if response given early

  - id: feedback_learning
    kind: feedback
    duration_ms: 2000
    image: correct_image                # feedback shows the _k_ (correct-position) image
    text: dynamic
    # "Richtig, die korrekte Position ist:"  (correct)
    # "Falsch, die korrekte Position ist:"   (incorrect)
    # "Zu spat, die korrekte Position ist:"  (timeout)
    text_size_px: 65
    text_pos: [0, 400]

  - id: stimulus_extra
    kind: bitmap
    duration_ms: dynamic                # deltaTime = 2500 - (resTime - lastStim.time())
    pos: [0, -70]
    note: extra display only for correct-but-late responses in learning trials

  - id: feedback_control
    kind: image_with_question           # single screen: image + question text
    duration_ms: 2500
    text: dynamic
    # "Ist das Haus auf der rechten Seite?" + correctness answer
    # "Richtig, das Haus ist auf der rechten Seite:"
    # "Richtig, das Haus ist nicht auf der rechten Seite:"
    # "Falsch, das Haus ist auf der rechten Seite:"
    # "Falsch, das Haus ist nicht auf der rechten Seite:"
    # "Zu spat, das Haus ist auf der rechten Seite:"
    # "Zu spat, das Haus ist nicht auf der rechten Seite:"
    text_size_px: 65
    text_pos: [0, 400]

  - id: instruction_page
    kind: bitmap
    duration_ms: null                   # forever — button-terminated
    size_px: [1280, 720]

  - id: block_intro_fixation
    kind: text
    text: "+"
    duration_ms: 4500
    repeats: 3                          # 3 × 4500 ms fixation before block info screen

  - id: block_intro_screen
    kind: bitmap
    asset: bubbles/learning.png or bubbles/control.png
    duration_ms: 4500
    size_px: [600, 398]

  - id: bye_screen
    kind: bitmap
    asset: bubbles/bye.png
    duration_ms: 4500
    size_px: [600, 398]
    note: shown only after last block (masterIndex==8, line 485-498 in 03_learning.sce)

  - id: hello_flash
    kind: text
    text: "Das Experiment\nbeginnt gleich.\nSind Sie bereit?"
    duration_ms: 100

