open_questions:
  - Q1: Practice images (prac/) not found anywhere.
        The PCL in 01_Prac.sce loads from absolute Windows paths to prac/.
        Are these images available from the original Presentation setup?
        They are needed for the practice block to run.

  - Q2: Instruction images (instr_11.jpg – instr_34.jpg) not found in SET_B.
        Instructions.pptx is present at SET_B/Instructions.pptx.
        The short paradigm (OLM_paradigm_short) has Folie*.JPG exports under
        Instr/instr/ — are these the same slides exported from the PPTX?
        If so, the generated script can copy Folie*.JPG into Stimuli/instr/
        as the psychopy output does for SET_A.

  - Q3: fMRI timing — use nominal PCL durations or empirical log medians?
        The probe found 1792 scanner pulses in run logs; the original was
        pulse-locked with variable empirical durations. For standalone use,
        nominal PCL values (2500 ms stimulus, 2000 ms feedback) are recommended.
        Confirm this choice.

  - Q4: Control block overlap with learning images.
        The probe reports that 5 of 28 learning/block1 images and 3 of 28
        learning/block2 images also appear in control/block1. This means
        participants see learning stimuli again during control. Check whether
        the original Presentation folders overlap; if they do not, the folders
        were mis-assembled. Escalate to the study author.

  - Q5: _quarantine/ directory — 76 images in _quarantine/learning/ and
        _quarantine/control/ are present on disk but NOT referenced in the
        current SET_B PCL (which resolves to learning/block1..4/ and
        control/block1..2/ without _quarantine/ prefix). Are these retired
        images or alternate versions that should be included in the conversion?

