paradigm: OLM_SET_B
source:
  exp: Projects/OLM/paradigm/presentation/OLM_paradigm/SET_B/Locato30_VersionB_fMRI.exp
  scenarios:
    - sce/00_Instr_1.sce       # 7 instruction slides (instr_11–17.jpg), white bg
    - sce/01_Prac.sce           # practice: 20 trials (10 pairs × 2 reps), feedback
    - sce/02_Instr_2.sce        # 1 instruction slide (instr_21.jpg), white bg
    - sce/03_learning.sce       # 4 learning blocks + 2 control blocks, randomized order
    - sce/04_Instr_3.sce        # 4 instruction slides (instr_31–34.jpg), white bg
    - sce/04_AFC.sce            # AFC: unshuffled, jpg_filter=0, 1624x1187
    - sce/05_AFC.sce            # AFC: shuffled, jpg_filter=1, 1324x1087
  stimuli_root: Projects/OLM/paradigm/presentation/OLM_paradigm/SET_B/Stimuli
  generated: 2026-07-21T12:40:00Z
  log_dir: Projects/OLM/paradigm/presentation/OLM_paradigm/SET_B/results
  log_count: 134                 # 46 for this SET, 134 total

display:
  background_rgb: [0, 0, 0]       # learning/practice/AFC
  background_rgb_instr: [255, 255, 255]  # instruction screens
  stimulus_size_px: [1024, 787]   # house stimuli
  info_bubble_size_px: [600, 398] # bubbles/
  afc_size_px: [1324, 1087]       # 05_AFC (filtered variant preferred)
  instr_size_px: [1280, 720]      # instruction bitmap slides
  font_size_px: 100               # fixation text
  font_size_feedback: 65          # feedback text in 03_learning.sce
  font_size_feedback_prac: 70     # feedback text in 01_Prac.sce
  units: pix

response:
  keys_learning: ['left', 'right']  # button 1 = left, button 2 = right
  keys_afc: ['1', '2', '3']        # 3-button forced choice
  quit_key: escape                 # Q in exp; Escape in PsychoPy
  timeout_ms: 2500                 # stimulus window (learning + practice)
  timeout_ms_control: 2500         # stimulus window in control trials
  timeout_ms_afc: null             # AFC waits indefinitely
  notes: >
    Port input → response code from real run:
    1792 = scanner pulse (ASCII 115='s'), 177 = Response 1 (98='b'),
    169 = Response 2 (97='a'). Preserve these semantics; write internal code to CSV.

# ───────────────────────────────────────────────────────────────────────────────
# Block structure (from sce/03_learning.sce, lines 401–436)
# PCL shuffles this array with constraints:
#   1. First block must NOT be "control"
#   2. No two adjacent blocks may have the same type
# The two control blocks are randomly assigned "control-1" and "control-2".
# Measured run order: block1 block2 block3 crt1 block4 crt2
# ───────────────────────────────────────────────────────────────────────────────
blocks:
  - name: learning-1
    type: learning
    block_dir: learning/block1
    n_unique_stimuli: 28           # 7 _k_ + 21 _i_ = 28 images per block
    n_reps: 4                      # 4 learning stages (LS1–LS4)
    n_trials: 112                  # 28 × 4
    randomize: true
    description: |
      Each of 28 images shown once per stage across 4 stages.
      Trial: house 2500 ms → first_response → feedback 2000 ms showing correct position.
      Inter-trial: mri_pulse counter increments.
      Inter-block: 3×4500 ms fixation + 1×4500 ms info bubble (bubbles/learning.png).

  - name: learning-2
    type: learning
    block_dir: learning/block2
    n_unique_stimuli: 28
    n_reps: 4
    n_trials: 112
    randomize: true

  - name: learning-3
    type: learning
    block_dir: learning/block3
    n_unique_stimuli: 28
    n_reps: 4
    n_trials: 112
    randomize: true

  - name: learning-4
    type: learning
    block_dir: learning/block4
    n_unique_stimuli: 28
    n_reps: 4
    n_trials: 112
    randomize: true

  - name: control-1
    type: control
    block_dir: control/block1
    n_unique_stimuli: 14
    n_reps: 4
    n_trials: 56
    randomize: true
    question: "Ist das Haus auf der rechten Seite?"  # German: Is the house on the right side?

  - name: control-2
    type: control
    block_dir: control/block2
    n_unique_stimuli: 14
    n_reps: 4
    n_trials: 56
    randomize: true
    question: "Ist das Haus auf der linken Seite?"   # German: Is the house on the left side?

  - name: practice
    type: practice
    source_dir: Stimuli/prac                           # DOES NOT EXIST
    fallback_dir: learning/block1                      # fallback if prac/ missing
    n_unique_stimuli: 20                               # 10 pairs × 2 images
    n_reps: 2
    n_trials: 40                                       # 10 pairs × 2 images × 2 reps
    randomize: true
    description: |
      Loads house-image pairs from prac/. Each pair: k (correct-pos) and i (incorrect-pos).
      Trial: house 2500 ms → first_response → feedback 2000 ms showing correct position.
      2 full passes through the shuffled pair list.

  - name: AFC
    type: AFC
    block_dir: AFC
    n_unique_stimuli: 30
    n_reps: 1
    n_trials: 30
    randomize: true                                    # shuffled in 05_AFC.sce
    description: |
      Three-button forced-choice: press 1, 2, or 3 to identify which of 3 houses.
      Full-screen composite images. 05_AFC preferred (jpg_filter=1, shuffled).

# ───────────────────────────────────────────────────────────────────────────────
# Events per trial type (durations in ms, as written in .sce)
# ───────────────────────────────────────────────────────────────────────────────

events_learning:
  - id: house_stimulus
    kind: bitmap
    asset: presPic
    duration_ms: 2500
    collect: true                                      # key + RT during this window
    port_code: 30                                      # pulse_code from 03_learning.sce
  - id: feedback
    kind: bitmap + text
    asset: presPicFB                                   # correct-position image
    text_field: FeedText                               # "Richtig/Falsch/Zu spät ..."
    duration_ms: 2000
    port_code: 30

events_control:
  - id: image_question
    kind: bitmap + text
    asset: presPicFB                                   # shows image + question text
    duration_ms: null                                  # waits for response
    collect: true
  - id: feedback
    kind: bitmap + text
    asset: presPicFB                                   # same image
    text_field: FeedText                               # "Richtig/Falsch/Zu spät ..." + answer
    duration_ms: 2000                                  # 2500 if no response in trial

events_afc:
  - id: composite
    kind: bitmap
    asset: presPic
    duration_ms: null                                  # waits for 3-button response
    collect: true
    width_px: 1324
    height_px: 1087

events_fixation:
  - id: inter_block_fixation
    kind: text
    text: "+"
    duration_ms: 4500
    port_code: 30

events_block_intro:
  - id: fixation_series
    kind: text
    text: "+"
    duration_ms: 4500
    repetitions: 3
  - id: bubble_screen
    kind: bitmap
    asset: bubbles/learning.png or bubbles/control.png
    duration_ms: 4500

# ───────────────────────────────────────────────────────────────────────────────
# Instructions (slides — advance by button press)
# ───────────────────────────────────────────────────────────────────────────────
instructions:
  part1:
    source: sce/00_Instr_1.sce
    n_slides: 7
    images:
      - instr_11.jpg   # code: Anw1, terminator button: 1
      - instr_12.jpg   # code: Anw2, terminator button: 1
      - instr_13.jpg   # code: Anw3, terminator button: 1
      - instr_14.jpg   # code: Anw4, terminator button: 1
      - instr_15.jpg   # code: Anw5, terminator button: 1
      - instr_16.jpg   # code: Anw6, terminator button: 1
      - instr_17.jpg   # code: Anw7, terminator button: 2 (final)
    background: white
    verify_exists: false
    note: >
      instr_*.jpg not in SET_B Stimuli. Instructions.pptx present at
      SET_B/Instructions.pptx. The short paradigm has Folie*.JPG exports
      under Instr/instr/ (36 files, 1280x720, full-screen). Consider copying
      the relevant Folie*.JPG set into psychopy Stimuli/instr/.

  part2:
    source: sce/02_Instr_2.sce
    n_slides: 1
    images:
      - instr_21.jpg   # code: Anw1, terminator button: 2 (final)
    background: white
    verify_exists: false

  part3:
    source: sce/04_Instr_3.sce
    n_slides: 4
    images:
      - instr_31.jpg   # code: Anw1, terminator button: 1
      - instr_32.jpg   # code: Anw2, terminator button: 1
      - instr_33.jpg   # code: Anw3, terminator button: 1
      - instr_34.jpg   # code: Anw4, terminator button: 2 (final)
    background: white
    verify_exists: false

  end_screen:
    text: "Das Experiment beginnt gleich.\n\nZu Erinnerung:\n   Ja = Zeigefinger\n   Nein = Daumen"
    duration_ms: 100                                   # IntroTrial.set_duration(100) in 03_learning.sce
    source: sce/03_learning.sce                        # lines 520–527

