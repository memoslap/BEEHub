# BEEHub Conversion Manifest — OLM SET_A
# Pass 1 — Inventory (NO code)
# generated: 2026-07-20

paradigm: OLM_SET_A
source:
  exp: Projects/OLM/paradigm/presentation/OLM_paradigm/SET_A/Locato30_VersionA_fMRI.exp
  scenarios:
    - sce/00_Instr_1.sce          # 7 instruction pages, white bg, button 2=next
    - sce/01_Prac.sce             # practice with feedback (obsolete 01_Prac_old.sce also exists)
    - sce/02_Instr_2.sce          # 1 instruction page, black bg, 3-button response
    - sce/03_learning.sce         # main experiment: 4 learning + 2 control blocks, interleaved
    - sce/04_Instr_3.sce          # 4 instruction pages, white bg
    - sce/04_AFC.sce              # forced-choice test, no shuffle, 3-button
    - sce/05_AFC.sce              # forced-choice test, shuffled, 3-button, .jpg filter
  stimuli_root: Projects/OLM/paradigm/presentation/OLM_paradigm/SET_A/Stimuli
  generated: 2026-07-20T00:00:00Z

display:
  background_rgb: [0, 0, 0]     # experiment screens (01_Prac, 03_learning, 02_Instr_2, AFC)
  units: pix
  # Instruction screens (00_Instr_1, 04_Instr_3) use [255, 255, 255] (white) — handled per-sce

response:
  keys: ['left', 'right']       # Keyboard in PsychoPy: left=correct/yes (code 1), right=wrong/no (code 2)
  quit_key: escape               # Presentation quit key Q replaced by PsychoPy convention
  timeout_ms: null               # trials use trial_duration=forever; waits for response
  # Original hardware: Presentation ResponseGrips (port codes 'a'=97, 'b'=98) in scanner;
  # mapped to codes 1,2 in the paradigm. PsychoPy uses keyboard instead.
  # Accuracy: code 1 on "_k_" file = correct; code 2 on "_i_" file = correct.

blocks:
  - name: practice
    type: practice
    n_trials: 40               # 20 unique images, each shown twice (2 reshuffled loops)
    unique_stimuli: 20           # 10 key images × 2 positions per key
    randomize: true              # reshuffled between the 2 loops
    stages: 1
    has_feedback: true
    # 01_Prac.sce: one_Ten[20][2] filled identically (cols 1&2 same), outer loop l=1..2
    # => 2 × 20 = 40 presentations. one_Ten.shuffle() called each iteration.

  - name: learning-1
    type: learning
    n_trials: 56               # 14 items × 4 repetitions (LS1–LS4)
    unique_stimuli: 28           # 7 key images + 21 paired positions
    randomize: true              # items shuffled by shuffleItems() — no consecutive same house number
    stages: 4                    # LS1–LS4 — same 14 items shown 4× with different position labels
    has_feedback: true
    source_images: learning/block1

  - name: learning-2
    type: learning
    n_trials: 56
    unique_stimuli: 28
    randomize: true
    stages: 4
    has_feedback: true
    source_images: learning/block2

  - name: learning-3
    type: learning
    n_trials: 56
    unique_stimuli: 28
    randomize: true
    stages: 4
    has_feedback: true
    source_images: learning/block3

  - name: learning-4
    type: learning
    n_trials: 56
    unique_stimuli: 21           # ONLY 21 images exist; 7 key (_k_) files are MISSING
    randomize: true
    stages: 4
    has_feedback: true
    source_images: learning/block4

  - name: control-1
    type: control
    n_trials: 56               # 14 images × 4 repetitions
    unique_stimuli: 14
    randomize: true              # ctrl1.shuffle() each repetition
    stages: 4
    has_feedback: true
    source_images: control/block1
    question: "Ist das Haus auf der rechten Seite?" (Is the house on the right side?)
    # Each control trial = ONE screen (image + question) for 2500 ms.
    # mainTrial presentation is commented out in the PCL — deliberate.

  - name: control-2
    type: control
    n_trials: 56               # 14 images × 4 repetitions
    unique_stimuli: 14
    randomize: true              # ctrl2.shuffle() each repetition
    stages: 4
    has_feedback: true
    source_images: control/block2
    question: "Ist das Haus auf der linken Seite?" (Is the house on the left side?)
    # Same single-screen structure as control-1.

events:
  - id: fixation
    kind: text
    text: "+"
    color: white
    duration_ms: 4500            # scan_period locked; presented between trials/blocks
    size_px: 100
    pos: [0, 0]

  - id: stimulus
    kind: bitmap
    duration_ms: 2500
    pos: [0, -70]
    size_px: [1024, 787]         # as defined in 01_Prac/03_learning bitmap declarations

  - id: feedback_learning
    kind: feedback
    duration_ms: 2000
    image: correct_image           # feedback shows the "correct" (key/_k_) image
    text: dynamic                  # "Richtig, die korrekte Position ist:" or
                                   # "Falsch, die korrekte Position ist:" or
                                   # "Zu spat, die korrekte Position ist:"
    text_size_px: 65
    text_pos: [0, 400]

  - id: stimulus_extra
    kind: bitmap
    duration_ms: dynamic           # deltaTime = 2500 - (resTime - lastStim.time()) for late correct responses
    pos: [0, -70]
    note: extra display time only for correct-but-late responses in learning trials

  - id: feedback_control
    kind: image_with_question      # single screen: image + question text, NOT separate stimulus + feedback
    duration_ms: 2500              # fixed; the commented-out mainTrial that would have provided a separate stimulus phase is intentional
    text: dynamic                  # "Ist das Haus auf der rechten/seiten Seite?" + correctness text
    text_size_px: 65
    text_pos: [0, 400]

  - id: instruction_page
    kind: bitmap
    duration_ms: null            # forever — button-terminated
    size_px: [1280, 720]

  - id: block_intro_fixation
    kind: text
    text: "+"
    duration_ms: 4500
    repeats: 3                   # 3 × 4500 ms fixation before block info screen

  - id: block_intro_screen
    kind: bitmap
    asset: bubbles/learning.png or bubbles/control.png
    duration_ms: 4500
    size_px: [600, 398]

  - id: bye_screen
    kind: bitmap
    asset: bubbles/bye.png
    duration_ms: 4500
    size_px: [600, 398]
    note: shown only after last block (masterIndex==8, line 541)

  - id: intro_hello
    kind: text
    text: "Das Experiment\nbeginnt gleich.\n\n Zu Erinnerung: \n   Ja = Zeigefinger\n Nein = Daumen"
    duration_ms: 100             # brief flash (line 525)

