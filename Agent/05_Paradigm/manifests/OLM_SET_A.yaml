open_questions:
  - id:block_order
  status_ resolved
  question:|
    Block order: 03_learning.sce defines `order[] = {"learning-1","learning-2","learning-3","learning-4","control","control"}`
    which is shuffled (with constraint: no two adjacent blocks same type, first block not control).
    The resulting order is non-deterministic at conversion time. For the generated experiment,
    a fixed seed or explicit order should be chosen. What order should be used?
    answer: |
      Preserve per-participant randomisation, matching the original. Shuffle at runtime with the
      same two constraints, seeded from the participant ID so a session is reproducible.
    applies_to: blocks

  - id: practice_trial_count
    status: resolved
    confidence: high
    source_of_truth: 01_Prac.sce (read directly)
    question: 20 or 40 practice trials?
    answer: |
      40 trials — 20 unique images, each presented twice.
      Derivation: one_Ten is declared [20][2]. The fill loop runs i=1..10 (picPairs.count()=10)
      and writes TWO rows per iteration (one, one+1), so all 20 rows are filled.
      The outer loop `loop l = 1 until l > 2` runs twice, and the inner loop runs
      one_Ten.count() = 20. So 2 x 20 = 40 presentations.
    correction_to_earlier_reading: |
      The earlier note speculated that "each loop shows a different image from the pair"
      because of the one_Ten[i][l] indexing. That is WRONG. Columns 1 and 2 are filled
      IDENTICALLY:
          one_Ten[one][1]   = picPairs[i][1]      one_Ten[one][2]   = picPairs[i][1]
          one_Ten[one+1][1] = picPairs[i][2]      one_Ten[one+1][2] = picPairs[i][2]
      So one_Ten[i][1] == one_Ten[i][2] for every i, and the value of l does not change
      which image is shown. The only difference between the two passes is the reshuffle
      (one_Ten.shuffle() is called at the top of each l iteration).
    manifest_action: |
      practice: n_trials: 40, n_unique: 20, repetitions: 2, reshuffle_between_repetitions: true
 
  - id: block4_missing_stimuli
    status: resolved
    confidence: high
    priority: CRITICAL
    source_of_truth: PlastMem-005 log (real run)
    question: block4 has 21 .jpg files instead of 28 — missing or intentional?
    answer: |
      MISSING. The real run used 28 unique stimuli in block4, exactly like blocks 1-3
      (verified: unique stimulus count per block = 28 / 28 / 28 / 28).
      The 28 split as 7 "_k_" files + 21 "_i_" files.
      Your repo has 21 files = exactly the count of "_i_" files, so the 7 missing files are
      almost certainly ALL the "_k_" (key/correct-position) images.
      These are the images shown on the feedback screen, so the paradigm cannot run correctly
      without them.
    verify: |
      ls Projects/OLM/.../Stimuli/learning/block4/*_k_*.jpg | wc -l    # expect 0 if hypothesis holds
    the_7_missing_files:
      - h24_p40_k_up_q4_left.jpg
      - h26_p20_k_up_q2_right.jpg
      - h27_p8_k_up_q1_left.jpg
      - h30_p14_k_up_q2_right.jpg
      - h34_p41_k_up_q4_left.jpg
      - h38_p37_k_up_q3_right.jpg
      - h44_p18_k_up_q1_right.jpg
    manifest_action: |
      DO NOT convert SET_A until these are recovered — otherwise the deficit is baked in.
      Record them under unresolved: until they are restored from backup or the original machine.
 
  - id: comment_30_to_28
    status: resolved
    confidence: high
    source_of_truth: 03_learning.sce lines 112-116 + log
    question: Is "# Change 30 -> 28" already applied, or is a parameter still 30?
    answer: |
      Already applied; the comment is a historical note. The arrays immediately below it are
      declared picPairsBLK1..4[7][4] = 7 x 4 = 28. The only other occurrences of "30" in the
      file are pulse_code = 30 (scanner trigger code, unrelated) and resTime = +3000 (ms).
      The log confirms 28 unique stimuli per learning block.
    manifest_action: no action
 
  - id: control_block_structure
    status: resolved
    confidence: high
    source_of_truth: 03_learning.sce lines ~1112-1145
    question: Do control blocks really have no separate stimulus presentation?
    answer: |
      Correct, and it is DELIBERATE, not an oversight. In the control branch the stimulus
      presentation lines are explicitly commented out:
          #presPic.set_draw_mode(1);
          #presPic.load();
          ####mainTrial.set_mri_pulse(pulse);
          #mainTrial.set_duration(2500);
          #mainTrial.present();
      What actually runs is only the feedback trial, carrying BOTH the image and the question:
          FeedTrial.set_duration(2500);
          FeedText.set_caption("Ist das Haus auf der rechten Seite?", true);
          presPicFB.set_filename(ctrl1[i][l]);
          FeedTrial.present();
      So a control trial = ONE screen (image + question) for 2500 ms.
      The systematic commenting-out indicates an intentional edit. Worth a one-line confirmation
      from the study author, but the code is unambiguous.
    manifest_action: |
      control trial = single event, kind: image_with_question, duration_ms: 2500
 
  - id: control_feedback_timing
    status: resolved
    confidence: high
    source_of_truth: same as control_block_structure
    question: Is 2500 ms the image+question presentation, or is there a hidden stimulus phase?
    answer: |
      2500 ms IS the image-with-question presentation. There is no hidden stimulus phase —
      the phase that would have provided it is the commented-out mainTrial above.
      Same mechanism as control_block_structure; the two questions are one issue.
 
  - id: response_device
    status: resolved
    confidence: high
    priority: HIGH
    source_of_truth: PlastMem-005 log (port/response pairs)
    question: ResponseGrips or keyboard? Which button means what?
    answer: |
      The original ran in the SCANNER with Presentation ResponseGrips. The log shows an exact,
      unambiguous mapping (counts from the real run):
          Port Input 98  -> Response 1    (192 occurrences)
          Port Input 97  -> Response 2    (142 occurrences)
          Port Input 115 -> Pulse 30      (1792 occurrences — scanner trigger, not a response)
      ASCII 97 = 'a', 98 = 'b' (the two grip buttons). Semantics from the 01_Prac.sce header
      comment: code 1 = left arrow = "richtig" (correct/yes); code 2 = right arrow = "falsch".
      FOR THE PSYCHOPY CONVERSION: use the keyboard (no scanner, no grips). Preserve the
      SEMANTICS, not the hardware codes:
          'left'  -> internal code 1 -> "richtig"/yes/correct
          'right' -> internal code 2 -> "falsch"/no/incorrect
      Write the internal code (1/2) to the CSV as well as the key name, so accuracy scoring
      matches the original analysis pipeline.
    manifest_action: |
      response: {keys: [left, right], mapping: {left: 1, right: 2}, quit_key: escape}
 
