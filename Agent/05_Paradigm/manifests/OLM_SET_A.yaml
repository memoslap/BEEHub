  - id: block_order
    status: resolved
    confidence: high
    source_of_truth: 03_learning.sce line 401-424 + log
    question: Fixed order or runtime shuffle?
    answer: |
      RUNTIME SHUFFLE — keep it. The source defines
        order[] = {"learning-1","learning-2","learning-3","learning-4","control","control"}
      shuffled with the constraints (first block not control; no two adjacent identical),
      then the two control blocks are assigned control-1/control-2 in shuffled order.
      A fixed order would change the study design, not just the implementation.
      The order actually run in PlastMem-005 was:
        block1 -> block2 -> block3 -> control-1 -> block4 -> control-2
      which satisfies both constraints — confirming the shuffle-with-constraints logic.
      Implement: shuffle at runtime with the same two constraints, seed from participant ID
      for reproducibility, and LOG the realised order to the CSV.
    manifest_action: |
      blocks: {randomize: true, seed_from: participant_id,
               constraints: [first_block_not_control, no_adjacent_same_type]}
 
  - id: scenario_chain_order
    status: partially_resolved
    confidence: medium
    source_of_truth: log (within-scenario only)
    question: What is the full scenario chain?
    answer: |
      WITHIN 03_learning the order is established (see block_order above):
        block1 -> block2 -> block3 -> control-1 -> block4 -> control-2
      Each learning block ran 14 trials x 4 repetitions (LS1-LS4) = 56 trials;
      each control block likewise 56 (crt1-l and crt2-r, 56 each).
      Total learning phase = 6 blocks x 56 = 336 trials.
      ACROSS scenarios the chain is NOT established by these logs — both uploaded logs cover
      only 03_learning. The assumed chain (00_Instr_1 -> 01_Prac -> 02_Instr_2 -> 03_learning
      -> AFC -> 04_Instr_3) remains plausible but unverified.
    how_to_settle: |
      List Ergebnisse/ and sort logs by timestamp — if each scenario wrote its own log, the
      true chain falls out. Otherwise ask whoever ran the sessions; it may be manual ordering.
 
  - id: fmri_emulation
    status: resolved_with_caveat
    confidence: high
    priority: HIGH
    source_of_truth: log (1792 real scanner pulses) + 03_learning.sce
    question: Should the generated experiment be standalone, without fMRI pulse emulation?
    answer: |
      YES, standalone — but this is NOT a trivial removal, and it is the single most important
      timing decision in the conversion.
      The original was genuinely pulse-locked: the log contains 1792 real scanner pulses
      (Port Input 115 -> Pulse 30), and trials call mainTrial.set_mri_pulse(pulse), meaning
      each trial WAITED for its scanner pulse rather than free-running.
      Consequence: logged stimulus durations are variable, not fixed. Measured from the real run
      (log units 0.1 ms):
        learning stimulus events : ~1000-1300 ms (clusters around 1000-1283)
        "extra Pic Time" events  : ~1330-1630 ms
        feedback (correct/incorrect): ~2100 ms  (code sets 2000; overshoot is pulse quantisation)
      So you CANNOT simply copy set_duration() values and call it faithful — the realised timing
      came from the interaction of those values with scan_period.
    decision_needed_from_study_owner: |
      Choose ONE and record it:
        (a) Use the nominal set_duration() values from the PCL (2500 / 2000 ms etc.) — simple,
            and what a standalone behavioural version would normally do.
        (b) Use the empirical median durations from the logs — closer to what participants
            actually experienced in the scanner.
      Recommend (a) for a standalone behavioural version, and state the choice explicitly in the
      provenance header. Do NOT mix the two.
    manifest_action: |
      Remove all pulse waiting. Ensure every duration in events: is an absolute ms value.
      Note in the provenance header that fMRI synchronisation was intentionally removed and
      which timing convention (a/b) was used.
